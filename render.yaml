databases:
  - name: reference-db
    databaseName: reference
    user: reference
    plan: free

services:
  - type: web
    name: reference-backend
    runtime: python
    rootDir: reference_backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed && gunicorn config.wsgi
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: reference-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: reference-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://reference-frontend.onrender.com

  - type: web
    name: reference-frontend
    runtime: node
    rootDir: reference_frontend
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    plan: free
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://reference-backend.onrender.com
